services:
  chatmail-console:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
    volumes:
      - "${CHATMAIL_MAIL_DIR:-./demo/mail}:/data/mail:ro"
      - "${CHATMAIL_ACCESS_LOG_HOST:-./demo/access.log}:/data/access.log:ro"
      - "${CHATMAIL_LOGIN_EVENTS_HOST:-./demo/chatmail.json.log}:/data/chatmail.json.log:ro"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
